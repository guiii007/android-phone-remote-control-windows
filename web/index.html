<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#111b2b">
  <title>掌上遥控</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main id="app">
    <header>
      <strong>掌上遥控</strong><span id="connection">未连接</span>
      <div class="tools"><button id="typing-toggle" type="button">打字</button><button id="overview" type="button">完整画面</button><button id="landscape" type="button" aria-pressed="false">横屏全屏</button><button id="settings-toggle" type="button" aria-expanded="false">选项</button><button id="disconnect" type="button">断开</button></div>
    </header>
    <section id="settings" hidden>
      <label>鼠标速度 <input id="speed" type="range" min="0.5" max="2" step="0.1" value="1"></label>
      <label>画面内按钮透明度 <input id="controls-opacity" type="range" min="0.25" max="1" step="0.05" value="1"><output id="opacity-value" for="controls-opacity">100%</output></label>
      <span id="stream-info">画面速度：等待测量</span>
      <label><input id="phone-clarity" type="checkbox" checked>清晰增强（手机端）</label><span id="clarity-state">不增加传输流量</span>
      <label>增强力度 <input id="clarity-strength" type="range" min="0.3" max="1.5" step="0.05" value="1.05"></label>
    </section>
    <section id="stage" aria-label="电脑画面">
      <canvas id="desktop" aria-label="电脑主屏幕"></canvas>
      <div id="frame-warning" role="status" hidden></div>
      <div id="cursor" aria-hidden="true"></div>
      <div id="click-marker" hidden aria-hidden="true"></div>
      <button id="handle" type="button" aria-label="拖动此圆柄移动电脑鼠标，也可使用方向键">✥</button>
      <div id="mouse-keys"><button type="button" id="left" aria-pressed="false">左键</button><button type="button" id="right" aria-pressed="false">右键</button><button type="button" id="wheel-up" aria-label="鼠标滚轮向上滚动" title="页面向上滚动，半格滚轮">滚轮↑</button><button type="button" id="wheel-down" aria-label="鼠标滚轮向下滚动" title="页面向下滚动，半格滚轮">滚轮↓</button></div>
    </section>
    <section id="editor-panel" hidden>
      <textarea id="editor" rows="1" maxlength="4000" aria-label="在手机上编辑准备输入电脑的文字" placeholder="在这里选词、改字，确认后输入电脑"></textarea>
      <div class="editor-actions"><button id="send-text" type="button">输入电脑</button><button id="delete-key" type="button" title="有草稿时删除草稿；草稿为空时删除电脑上的文字">⌫ 删除</button><button id="newline-key" type="button" title="向电脑发送 Shift＋Enter">换行</button><button id="enter-key" type="button" title="向电脑发送 Enter，按目标软件的设置执行发送或提交">发送</button><button id="close-editor" type="button">收起键盘</button></div>
    </section>
    <footer id="status" role="status" aria-live="polite">右手拖圆柄，左手点击；请先连接电脑。</footer>
    <div id="pairing">
      <form id="pairing-form">
        <div id="first-pairing" hidden>
          <h1>首次配对这台手机</h1>
          <p>只需一次：输入电脑密钥，再设置你自己的四位解锁密码。</p>
          <label for="token">电脑配对密钥</label><input id="token" type="password" autocomplete="off" spellcheck="false">
          <label for="new-pin">设置四位密码</label><input id="new-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
          <label for="confirm-pin">再输入一次</label><input id="confirm-pin" type="password" inputmode="numeric" maxlength="4" autocomplete="new-password">
          <button type="submit">保存并连接</button>
        </div>
        <div id="pin-lock" hidden>
          <h1>解锁你的电脑</h1><p>输入四位密码</p>
          <div id="pin-dots" aria-label="已输入零位密码"><i></i><i></i><i></i><i></i></div>
          <div id="pin-pad"><button type="button" data-digit="1">1</button><button type="button" data-digit="2">2</button><button type="button" data-digit="3">3</button><button type="button" data-digit="4">4</button><button type="button" data-digit="5">5</button><button type="button" data-digit="6">6</button><button type="button" data-digit="7">7</button><button type="button" data-digit="8">8</button><button type="button" data-digit="9">9</button><span></span><button type="button" data-digit="0">0</button><button id="pin-delete" type="button" aria-label="删除一位密码">⌫</button></div>
          <button id="pair-again" type="button">重新配对 / 忘记密码</button>
        </div>
        <p id="pairing-error" role="alert"></p>
      </form>
    </div>
  </main>
  <script type="module" src="/app.js"></script>
</body>
</html>
